name: Bug report
description: A file that won't load, a workflow that fails, or output that looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Misuse and safety problems go to abuse@verboa.io, not here (see SECURITY.md).
        Please don't post explicit images in issues.
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options: [ComfyUI, ComfyUI-GGUF, diffusers, mflux, other]
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File or repo
      placeholder: verboa-image-1.0-fp8.safetensors
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: GPU or Mac, and OS
      placeholder: RTX 4090, Windows 11
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The error text, or what looks wrong. Steps, guidance, size and seed help.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: ComfyUI, diffusers or mflux version
      render: text
